# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Base Settings
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
unbind C-b
set-option -g prefix C-a
unbind v
bind v copy-mode
set -g mouse on

# Window Settings
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
# Vim Style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file ~/.tmux.conf

# for vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Instant switch to a new tmux session directory that exist
# bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"
unbind -T copy-mode-vi MouseDragEnd1Pane

# tpm tmux plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-sessionx'          # session picker: prefix + o
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin "tmux-plugins/tmux-resurrect"   # persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum"   # automatically save sessions every 15mins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'olimorris/tmux-pomodoro-plus'  # timer: prefix + P start/pause, prefix + Alt-p cancel
set -g @plugin 'sainnhe/tmux-fzf'              # fzf menu for windows, panes, keybindings, processes: prefix + F

# AI Usage
set -g @plugin 'isenthamiz/tmux-ai-usage'

# Plugin options
set -g @sessionx-bind 'o'
set -g @pomodoro_toggle 'P'
set -g @pomodoro_cancel 'M-p'
set -g @pomodoro_skip 'M-s'          # default '_' would take pain-control's full-width split
set -g @online_icon "ok"
set -g @offline_icon "nok"
set -g @ai_usage_providers 'claude cursor'
set -g @ai_usage_claude_window 'wk'
set -g @ai_usage_cursor_window 'wk'
# tmux-fzf reads environment variables, not @options. Sessions are left to sessionx.
TMUX_FZF_ORDER='window|pane|keybinding|process'
TMUX_FZF_OPTIONS='-p -w 62% -h 38% -m --color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8,fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc,marker:#b4befe,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8,selected-bg:#45475a,border:#313244,label:#cdd6f4'

## Theme: catppuccin mocha, which supplies the @thm_* colours used below
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# ---------------------------------------------------------------------------
# Status bar: two rows on a clear background, built from rounded groups.
#
#   row 1:  ( dir | git )                ( pomodoro | battery | offline ) ( session )
#   row 2:  ( state ) ( 1 zsh | 2 claude | 3 nvim )                      ( AI usage )
#
# A group has rounded ends. Inside it, each item is a tinted icon block
# followed by its text on the group body (surface_0). Pomodoro, battery and
# offline appear only when they have something to say.
# ---------------------------------------------------------------------------

# Tints: each accent blended 30% over the base colour #1e1e2e.
set -g @tint_red       '#5d3e52'
set -g @tint_peach     '#604a48'
set -g @tint_green     '#465950'
set -g @tint_blue      '#3e4b6b'
set -g @tint_mauve     '#51466a'
set -g @tint_yellow    '#5f5854'
set -g @tint_teal      '#415860'
set -g @tint_lavender  '#4b4e6c'
set -g @tint_surface_2 '#2f3041'

set -g status 2
set -g status-position bottom
set -g status-style "bg=default"
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 200

# Jobs that feed row 1.
%hidden PLUGINS="$HOME/.config/tmux/.tmux/plugins"
%hidden GIT='#(gitmux -cfg ~/.gitmux.conf "#{pane_current_path}" | sed -E "s/ *#\[fg=default.bg=default\]$//")'
%hidden BAT='#(~/.config/tmux/scripts/battery.sh)'
%hidden OFF="#($PLUGINS/tmux-online-status/scripts/online_status_icon.sh)"
%hidden POMO="#($PLUGINS/tmux-pomodoro-plus/scripts/pomodoro.sh)"
%hidden HAS_GIT="#{!=:$GIT,}"
%hidden HAS_BAT="#{!=:$BAT,}"
%hidden HAS_OFF="#{!=:$OFF,ok}"
%hidden HAS_POMO="#{!=:$POMO,}"

# Row 1 left: ( dir | git )
%hidden DIR_ITEM="#[fg=#{@thm_blue}]#[bg=#{@tint_blue}]  #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] #{=24:#{b:pane_current_path}} "
%hidden GIT_ITEM="#[fg=#{@thm_mauve}]#[bg=#{@tint_mauve}]  #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] $GIT "
%hidden CODE_GROUP="#[fg=#{@tint_blue}]#[bg=default]$DIR_ITEM#{?$HAS_GIT,$GIT_ITEM,}#[fg=#{@thm_surface_0}]#[bg=default]"

# Row 1 right: ( pomodoro | battery | offline ) ( session )
%hidden POMO_ITEM="#[fg=#{@thm_red}]#[bg=#{@tint_red}] 󱎫 #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] $POMO "
%hidden BAT_ITEM="#[fg=#{@thm_peach}]#[bg=#{@tint_peach}] 󰂃 #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] $BAT "
%hidden OFF_ITEM="#[fg=#{@thm_red}]#[bg=#{@tint_red}] 󰖪 #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] offline "
%hidden TMP_FIRST="#{?$HAS_POMO,#{@tint_red},#{?$HAS_BAT,#{@tint_peach},#{@tint_red}}}"
%hidden TMP_ANY="#{||:#{||:$HAS_POMO,$HAS_BAT},$HAS_OFF}"
%hidden TMP_GROUP="#[fg=$TMP_FIRST]#[bg=default]#{?$HAS_POMO,$POMO_ITEM,}#{?$HAS_BAT,$BAT_ITEM,}#{?$HAS_OFF,$OFF_ITEM,}#[fg=#{@thm_surface_0}]#[bg=default]#[bg=default] "
%hidden SESS_GROUP="#[fg=#{@tint_green}]#[bg=default]#[fg=#{@thm_green}]#[bg=#{@tint_green}]  #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] #S #[fg=#{@thm_surface_0}]#[bg=default]"

# Row 2 left: ( state ). One icon, first match wins:
# prefix, copy mode, synchronized panes, zoomed, marked pane, bell/activity, else tmux.
%hidden ST_BG='#{?client_prefix,#{@tint_red},#{?pane_in_mode,#{@tint_yellow},#{?pane_synchronized,#{@tint_mauve},#{?window_zoomed_flag,#{@tint_peach},#{?pane_marked,#{@tint_teal},#{?#{!=:#{session_alerts},},#{@tint_red},#{@tint_green}}}}}}}'
%hidden ST_FG='#{?client_prefix,#{@thm_red},#{?pane_in_mode,#{@thm_yellow},#{?pane_synchronized,#{@thm_mauve},#{?window_zoomed_flag,#{@thm_peach},#{?pane_marked,#{@thm_teal},#{?#{!=:#{session_alerts},},#{@thm_red},#{@thm_green}}}}}}}'
%hidden ST_GLYPH='#{?client_prefix,,#{?pane_in_mode,,#{?pane_synchronized,󰓦,#{?window_zoomed_flag,󰁌,#{?pane_marked,󰃀,#{?#{!=:#{session_alerts},},󰂞,}}}}}}'
set -g status-left "#[bg=default] #[fg=$ST_BG]#[bg=default]#[fg=$ST_FG]#[bg=$ST_BG]#[bold] $ST_GLYPH #[nobold]#[fg=$ST_BG]#[bg=default]#[bg=default] "

# Row 2 middle: ( windows ), one group; rounded ends on the first and last window.
%hidden NUM_BG='#{?window_active,#{@tint_peach},#{@tint_surface_2}}'
%hidden NUM_FG='#{?window_active,#{@thm_peach},#{@thm_fg}}'
%hidden LABEL_FG='#{?window_active,#{@thm_peach},#{@thm_overlay_1}}'
%hidden WIN="#{?window_start_flag,#[fg=$NUM_BG]#[bg=default],}#[fg=$NUM_FG]#[bg=$NUM_BG]#{?window_active,#[bold],} #I #[fg=$LABEL_FG]#[bg=#{@thm_surface_0}]#{?#{!=:#{window_name},Window}, #W ,}#[nobold]#{?window_end_flag,#[fg=#{@thm_surface_0}]#[bg=default],}"
set -g window-status-format "$WIN"
set -g window-status-current-format "$WIN"
set -g window-status-separator ""
set -g window-status-style "bg=default"
set -g window-status-current-style "bg=default"
set -g window-status-last-style "bg=default"
set -g window-status-activity-style "bg=default,underscore"
set -g window-status-bell-style "bg=default,underscore"
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Row 2 right: ( AI usage ). tmux-ai-usage replaces #{ai_usage}; continuum appends its save job.
set -g status-right "#[fg=#{@tint_lavender}]#[bg=default]#[fg=#{@thm_lavender}]#[bg=#{@tint_lavender}] 󰚩 #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] #{ai_usage} #[fg=#{@thm_surface_0}]#[bg=default]#[bg=default] "

# Row 1 is a custom status line; row 2 is tmux's default line (status-left,
# windows, status-right), copied from status-format[0] before it is replaced.
set -gu status-format
run 'tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")"'
set -g "status-format[0]" "#[align=left]#[bg=default] $CODE_GROUP#[align=right]#{?$TMP_ANY,$TMP_GROUP,}$SESS_GROUP "

# initialize tmux plugin manager (keep this line at the bottom of the file)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
