# gitmux config for the tmux status bar (catppuccin mocha colours).
# Plain fg-only styles so the text sits inside the status bar's git block.
tmux:
  symbols:
    branch: ""
    hashprefix: ":"
    ahead: "↑"
    behind: "↓"
    staged: "+"
    conflict: "✖"
    modified: "●"
    untracked: "…"
    stashed: "⚑"
    clean: ""
    insertions: "Σ"
    deletions: "Δ"
  styles:
    clear: ""
    state: "#[fg=#f38ba8]"
    branch: "#[fg=#cdd6f4]"
    remote: "#[fg=#7f849c]"
    divergence: "#[fg=#94e2d5]"
    staged: "#[fg=#a6e3a1]"
    conflict: "#[fg=#f38ba8]"
    modified: "#[fg=#f9e2af]"
    untracked: "#[fg=#7f849c]"
    stashed: "#[fg=#89dceb]"
    clean: ""
    insertions: "#[fg=#a6e3a1]"
    deletions: "#[fg=#f38ba8]"
  layout: [branch, " ", divergence, " ", flags]
  options:
    branch_max_len: 24
    branch_trim: right
    ellipsis: "…"
    hide_clean: true
    divergence_space: true
